[package]
name = "yu-oracle-desktop"
version = "1.0.0"
description = "Tarot and I Ching oracle desktop app"
authors = ["Thatgfsj"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "yu_oracle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
