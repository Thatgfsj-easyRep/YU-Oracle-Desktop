name: PROBE-10
on:
  push:
    paths:
      - ".github/workflows/ios-probe-10.yml"
permissions:
  contents: read
jobs:
  _stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo stub
  ios-signed:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    needs: _stub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: "**/*.ipa"
          retention-days: 7
          if-no-files-found: error

