name: PROBE-8
on:
  push:
    paths:
      - ".github/workflows/ios-probe-8.yml"
permissions:
  contents: read
jobs:
  _stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo stub
  ios-signed:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    needs: _stub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auth"
          printf '%s' "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/auth/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/auth/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"

