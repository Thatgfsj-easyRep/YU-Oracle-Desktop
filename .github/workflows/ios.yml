name: iOS

# 产出物：未签名 .app / .ipa（证明工程能在真机架构上编译打包）。
# 要装进手机还需要签名，见文件末尾 ios-signed 作业与 .github/IOS_SIGNING.md。
#
# 说明：本仓库是 public 仓库，GitHub 托管 macOS runner 对 public 仓库不计费
#（GitHub 定价页原文："Minutes are free for public repositories."），
# 所以这里的 macOS 作业不占用账号的付费分钟数。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 便宜的把关：不碰 macOS，先把配置和前端过一遍 ──
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check tauri.conf.json
        run: |
          set -euo pipefail
          node -e '
            const c = JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const need = ["productName", "identifier", "build", "app", "bundle"];
            for (const k of need) if (!(k in c)) throw new Error("tauri.conf.json 缺 " + k);
            if (!/^[A-Za-z0-9.-]+$/.test(c.identifier))
              throw new Error("identifier 含非法字符：" + c.identifier);
            const ios = c.bundle.iOS || {};
            console.log("identifier =", c.identifier);
            console.log("bundle.iOS =", JSON.stringify(ios));
            console.log("bundle.icon =", c.bundle.icon.join(", "));
          '

      - name: iOS icon set present
        run: |
          set -euo pipefail
          ls src-tauri/icons/ios/AppIcon-512@2x.png
          n=$(ls src-tauri/icons/ios/*.png | wc -l)
          echo "iOS 图标 $n 个"
          [ "$n" -ge 16 ]

  # ── 真正的 iOS 构建（macOS runner）──
  ios-unsigned:
    needs: static
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain + iOS target
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add aarch64-apple-ios
          xcodebuild -version
          pod --version || echo "（未装 CocoaPods，Tauri 若需要会由 tauri ios init 提示）"

      - name: Install npm dependencies & build frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build          # tauri.conf 的 beforeBuildCommand 等价物，xcodebuild 之前必须已有 dist/

      - name: Cache cargo registry and iOS build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/aarch64-apple-ios
          key: ios-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: ios-cargo-${{ runner.os }}-

      - name: Generate iOS project (tauri ios init)
        run: npx tauri ios init --ci

      # Tauri 2 的 iOS 工程由 xcodegen 生成在 src-tauri/gen/apple/（不是 Tauri 1 的 ios-app/），
      # 且工程名跟随 productName（这里是中文 + 空格 + ·），所以不猜路径，递归找。
      # Tauri 2.11 的 "Build Rust Code" 脚本阶段会经 WebSocket 回连 CLI 的
      # options server（crates/tauri-cli/src/mobile/mod.rs 的 read_options），
      # 所以**不能**绕过 `tauri ios build` 直接调 xcodebuild——脚本会 panic
      # "failed to read missing addr file ...-server-addr"。
      # 正解是用 CLI 自带的 --no-sign（文档页没列，但 clap 里有：
      # "Skip code signing when bundling the app"），archive 阶段会 skip_codesign。
      - name: Build device .app without signing (tauri ios build --no-sign)
        run: |
          set -euo pipefail
          npx tauri ios build --ci --target aarch64 --no-sign \
            --build-number "$GITHUB_RUN_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/tauri-ios-build.log" | tail -80

      - name: Package unsigned .app into .ipa
        run: |
          set -euo pipefail
          app=$(find . -type d -name '*.app' \
                  -not -path './node_modules/*' -not -path '*/IntermediateBuildFilesPath/*' \
                  | head -1)
          if [ -z "$app" ]; then
            echo "没找到 .app 产物"; find . -maxdepth 4 -name '*.xcarchive' -o -maxdepth 4 -type d -name build | head; exit 1
          fi
          echo "产物：$app"; du -sh "$app"
          ls -la "$app"
          bin="$app/$(/usr/bin/plutil -extract CFBundleExecutable raw "$app/Info.plist")"
          echo "可执行文件：$bin"
          /usr/bin/lipo -archs "$bin"          # 必须是 arm64，证明这是真机切片而非模拟器
          # Tauri 把前端与牌图嵌进 Mach-O（asset map），所以 .app 里没有 dist/ 目录是正常的；
          # 这里抽查两张牌的路径确认真的打进去了。
          n=$(strings -a "$bin" | grep -c 'tarot/cards/' || true)
          echo "asset map 里的牌图路径：$n 条（应为 78）"
          if [ "$n" -lt 78 ]; then
            echo "::warning::牌图路径少于 78 条，前端资源可能没打全"
          fi
          mkdir -p dist Payload
          cp -R "$app" Payload/
          zip -qr dist/Oracle-unsigned.ipa Payload
          zip -qr dist/Oracle-unsigned.app.zip Payload
          rm -rf Payload
          ls -la dist

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          # 只上传两个归档；dist/ 里还有 Vite 的前端产物，没必要塞进 artifact
          path: |
            dist/Oracle-unsigned.ipa
            dist/Oracle-unsigned.app.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tauri-build-log
          path: ${{ runner.temp }}/tauri-ios-build.log
          if-no-files-found: ignore

  # ── 可选：真正签名的构建。默认关闭，因为没有 Apple 开发者账号时必失败 ──
  # 打开方式：gh variable set ENABLE_SIGNED_BUILD -b true（仓库 Variables），
  # 并按 .github/IOS_SIGNING.md 配好 Secrets。
  ios-signed:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    needs: static
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require signing inputs
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ vars.APPLE_DEVELOPMENT_TEAM }}" ] && missing+=("Variable APPLE_DEVELOPMENT_TEAM")
          if [ -z "${{ secrets.APPLE_API_KEY }}" ] && [ -z "${{ secrets.IOS_CERTIFICATE }}" ]; then
            missing+=("Secret APPLE_API_KEY(+APPLE_API_ISSUER) 或 IOS_CERTIFICATE(+IOS_CERTIFICATE_PASSWORD,IOS_MOBILE_PROVISION)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '缺少签名配置：%s\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: rustup target add aarch64-apple-ios

      - run: npm ci && npm run build

      - name: Generate iOS project
        run: npx tauri ios init --ci

      # 自动签名（App Store Connect API key）：上游文档要求这三个环境变量。
      # 注意：steps.if 的可用上下文里**没有 secrets**（官方 contexts 可用性表），
      # 所以"密钥配了没"只能在脚本里判断，secrets 通过 env 映射传进来。
      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_B64" ] || [ -z "$ASC_ISSUER" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "没配 App Store Connect API key，跳过自动签名（将使用 IOS_CERTIFICATE* 手动签名）"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/auth"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/auth/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/auth/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/auth/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$ASC_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$ASC_KEY_ID" >> "$GITHUB_ENV"

      - name: Sign and export (tauri ios build)
        env:
          # config schema 里写明：APPLE_DEVELOPMENT_TEAM 环境变量会覆盖
          # bundle.iOS.developmentTeam，所以 Team ID 不用提交进仓库，也不用 --config 转义 JSON。
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          set -euo pipefail
          npx tauri ios build --ci --target aarch64 \
            --export-method "$EXPORT_METHOD" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: "**/*.ipa"
          retention-days: 7
          if-no-files-found: error
