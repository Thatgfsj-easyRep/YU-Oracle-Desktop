name: iOS

# 产出物：未签名 .app / .ipa（证明工程能在真机架构上编译打包）。
# 要装进手机还需要签名，见文件末尾 ios-signed 作业与 .github/IOS_SIGNING.md。
#
# 说明：本仓库是 public 仓库，GitHub 托管 macOS runner 对 public 仓库不计费
#（GitHub 定价页原文："Minutes are free for public repositories."），
# 所以这里的 macOS 作业不占用账号的付费分钟数。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 便宜的把关：不碰 macOS，先把配置和前端过一遍 ──
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check tauri.conf.json
        run: |
          set -euo pipefail
          node -e '
            const c = JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const need = ["productName", "identifier", "build", "app", "bundle"];
            for (const k of need) if (!(k in c)) throw new Error("tauri.conf.json 缺 " + k);
            if (!/^[A-Za-z0-9.-]+$/.test(c.identifier))
              throw new Error("identifier 含非法字符：" + c.identifier);
            const ios = c.bundle.iOS || {};
            console.log("identifier =", c.identifier);
            console.log("bundle.iOS =", JSON.stringify(ios));
            console.log("bundle.icon =", c.bundle.icon.join(", "));
          '

      - name: iOS icon set present
        run: |
          set -euo pipefail
          ls src-tauri/icons/ios/AppIcon-512@2x.png
          n=$(ls src-tauri/icons/ios/*.png | wc -l)
          echo "iOS 图标 $n 个"
          [ "$n" -ge 16 ]

  # ── 真正的 iOS 构建（macOS runner）──
  ios-unsigned:
    needs: static
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain + iOS target
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add aarch64-apple-ios
          xcodebuild -version
          pod --version || echo "（未装 CocoaPods，Tauri 若需要会由 tauri ios init 提示）"

      - name: Install npm dependencies & build frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build          # tauri.conf 的 beforeBuildCommand 等价物，xcodebuild 之前必须已有 dist/

      - name: Cache cargo registry and iOS build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/aarch64-apple-ios
          key: ios-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: ios-cargo-${{ runner.os }}-

      - name: Generate iOS project (tauri ios init)
        run: npx tauri ios init --ci

      - name: Locate generated Xcode project and scheme
        id: proj
        run: |
          set -euo pipefail
          proj=$(ls -d ios-app/*.xcodeproj | head -1)
          echo "project=$proj" >> "$GITHUB_OUTPUT"
          xcodebuild -list -project "$proj"
          scheme=$(xcodebuild -list -json -project "$proj" | python3 -c 'import json,sys;print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "target name = $scheme | project = $proj"

      - name: Build for device (unsigned)
        env:
          PROJECT: ${{ steps.proj.outputs.project }}
          SCHEME: ${{ steps.proj.outputs.scheme }}
          CONFIG: ${{ github.event.inputs.configuration || 'release' }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            EXPANDED_CODE_SIGN_IDENTITY= \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -60

      - name: Package unsigned .app into .ipa
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/DD/Build/Products" -maxdepth 2 -name '*.app' -print -quit)
          echo "找到 app 产物：$app"
          test -d "$app"
          du -sh "$app"
          mkdir -p dist Payload
          cp -R "$app" Payload/
          zip -qr "dist/Oracle-unsigned.ipa" Payload
          zip -qr dist/Oracle-unsigned.app.zip Payload
          ls -la dist
          rm -rf Payload

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

  # ── 可选：真正签名的构建。默认关闭，因为没有 Apple 开发者账号时必失败 ──
  # 打开方式：gh variable set ENABLE_SIGNED_BUILD -b true（仓库 Variables），
  # 并按 .github/IOS_SIGNING.md 配好 Secrets。
  ios-signed:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    needs: static
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require signing inputs
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ vars.APPLE_DEVELOPMENT_TEAM }}" ] && missing+=("Variable APPLE_DEVELOPMENT_TEAM")
          if [ -z "${{ secrets.APPLE_API_KEY }}" ] && [ -z "${{ secrets.IOS_CERTIFICATE }}" ]; then
            missing+=("Secret APPLE_API_KEY(+APPLE_API_ISSUER) 或 IOS_CERTIFICATE(+IOS_CERTIFICATE_PASSWORD,IOS_MOBILE_PROVISION)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '缺少签名配置：%s\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: rustup target add aarch64-apple-ios

      - run: npm ci && npm run build

      - name: Generate iOS project
        run: npx tauri ios init --ci

      # 自动签名（App Store Connect API key）：上游文档要求这三个环境变量
      - name: Prepare App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auth"
          printf '%s' "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/auth/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/auth/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"

      - name: Sign and export (tauri ios build)
        env:
          # config schema 里写明：APPLE_DEVELOPMENT_TEAM 环境变量会覆盖
          # bundle.iOS.developmentTeam，所以 Team ID 不用提交进仓库，也不用 --config 转义 JSON。
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          set -euo pipefail
          npx tauri ios build --ci --target aarch64 \
            --export-method "$EXPORT_METHOD" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: "**/*.ipa"
          retention-days: 7
          if-no-files-found: error
