name: PROBE-3
on:
  push:
    paths:
      - ".github/workflows/ios-probe-3.yml"
permissions:
  contents: read
jobs:
  ios-signed:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require signing inputs
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ vars.APPLE_DEVELOPMENT_TEAM }}" ] && missing+=("Variable APPLE_DEVELOPMENT_TEAM")
          if [ -z "${{ secrets.APPLE_API_KEY }}" ] && [ -z "${{ secrets.IOS_CERTIFICATE }}" ]; then
            missing+=("Secret APPLE_API_KEY(+APPLE_API_ISSUER) 或 IOS_CERTIFICATE(+IOS_CERTIFICATE_PASSWORD,IOS_MOBILE_PROVISION)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '缺少签名配置：%s\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: rustup target add aarch64-apple-ios

      - run: npm ci && npm run build

      - name: Generate iOS project
        run: npx tauri ios init --ci

      # 自动签名（App Store Connect API key）：上游文档要求这三个环境变量
      - name: Prepare App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auth"
          printf '%s' "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/auth/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/auth/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"

      - name: Sign and export (tauri ios build)
        env:
          # config schema 里写明：APPLE_DEVELOPMENT_TEAM 环境变量会覆盖
          # bundle.iOS.developmentTeam，所以 Team ID 不用提交进仓库，也不用 --config 转义 JSON。
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          set -euo pipefail
          npx tauri ios build --ci --target aarch64 \
            --export-method "$EXPORT_METHOD" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: "**/*.ipa"
          retention-days: 7
          if-no-files-found: error

