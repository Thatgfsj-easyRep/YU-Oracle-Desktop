name: PROBE-1

# 产出物：未签名 .app / .ipa（证明工程能在真机架构上编译打包）。
# 要装进手机还需要签名，见文件末尾 ios-signed 作业与 .github/IOS_SIGNING.md。
#
# 说明：本仓库是 public 仓库，GitHub 托管 macOS runner 对 public 仓库不计费
#（GitHub 定价页原文："Minutes are free for public repositories."），
# 所以这里的 macOS 作业不占用账号的付费分钟数。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: [main]
    paths: [".github/workflows/ios-probe-1.yml"]
  pull_request:
    paths: [".github/workflows/ios-probe-1.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 便宜的把关：不碰 macOS，先把配置和前端过一遍 ──
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check tauri.conf.json
        run: |
          set -euo pipefail
          node -e '
            const c = JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const need = ["productName", "identifier", "build", "app", "bundle"];
            for (const k of need) if (!(k in c)) throw new Error("tauri.conf.json 缺 " + k);
            if (!/^[A-Za-z0-9.-]+$/.test(c.identifier))
              throw new Error("identifier 含非法字符：" + c.identifier);
            const ios = c.bundle.iOS || {};
            console.log("identifier =", c.identifier);
            console.log("bundle.iOS =", JSON.stringify(ios));
            console.log("bundle.icon =", c.bundle.icon.join(", "));
          '

      - name: iOS icon set present
        run: |
          set -euo pipefail
          ls src-tauri/icons/ios/AppIcon-512@2x.png
          n=$(ls src-tauri/icons/ios/*.png | wc -l)
          echo "iOS 图标 $n 个"
          [ "$n" -ge 16 ]

  # ── 真正的 iOS 构建（macOS runner）──
