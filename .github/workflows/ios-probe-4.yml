name: PROBE-4
on:
  push:
    paths:
      - ".github/workflows/ios-probe-4.yml"
permissions:
  contents: read
jobs:
  _stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo stub
  ios-unsigned:
    needs: _stub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain + iOS target
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add aarch64-apple-ios
          xcodebuild -version
          pod --version || echo "（未装 CocoaPods，Tauri 若需要会由 tauri ios init 提示）"

      - name: Install npm dependencies & build frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build          # tauri.conf 的 beforeBuildCommand 等价物，xcodebuild 之前必须已有 dist/

      - name: Cache cargo registry and iOS build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/aarch64-apple-ios
          key: ios-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: ios-cargo-${{ runner.os }}-

      - name: Generate iOS project (tauri ios init)
        run: npx tauri ios init --ci

      - name: Locate generated Xcode project and scheme
        id: proj
        run: |
          set -euo pipefail
          proj=$(ls -d ios-app/*.xcodeproj | head -1)
          echo "project=$proj" >> "$GITHUB_OUTPUT"
          xcodebuild -list -project "$proj"
          scheme=$(xcodebuild -list -json -project "$proj" | python3 -c 'import json,sys;print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "target name = $scheme | project = $proj"

      - name: Build for device (unsigned)
        env:
          PROJECT: ${{ steps.proj.outputs.project }}
          SCHEME: ${{ steps.proj.outputs.scheme }}
          CONFIG: ${{ github.event.inputs.configuration || 'release' }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            EXPANDED_CODE_SIGN_IDENTITY= \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -60

      - name: Package unsigned .app into .ipa
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/DD/Build/Products" -maxdepth 2 -name '*.app' -print -quit)
          echo "找到 app 产物：$app"
          test -d "$app"
          du -sh "$app"
          mkdir -p dist Payload
          cp -R "$app" Payload/
          zip -qr "dist/Oracle-unsigned.ipa" Payload
          zip -qr dist/Oracle-unsigned.app.zip Payload
          ls -la dist
          rm -rf Payload

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

  # ── 可选：真正签名的构建。默认关闭，因为没有 Apple 开发者账号时必失败 ──
  # 打开方式：gh variable set ENABLE_SIGNED_BUILD -b true（仓库 Variables），
  # 并按 .github/IOS_SIGNING.md 配好 Secrets。
