name: PROBE-11
on:
  push:
    paths:
      - ".github/workflows/ios-probe-11.yml"
permissions:
  contents: read
jobs:
  _stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo stub
  ios-signed:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    needs: _stub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require signing inputs
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ vars.APPLE_DEVELOPMENT_TEAM }}" ] && missing+=("Variable APPLE_DEVELOPMENT_TEAM")
          if [ -z "${{ secrets.APPLE_API_KEY }}" ] && [ -z "${{ secrets.IOS_CERTIFICATE }}" ]; then
            missing+=("Secret APPLE_API_KEY(+APPLE_API_ISSUER) 或 IOS_CERTIFICATE(+IOS_CERTIFICATE_PASSWORD,IOS_MOBILE_PROVISION)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '缺少签名配置：%s\n' "${missing[@]}"
            exit 1
          fi

